name: Build VyOS rolling Fullcone ISO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyos-rolling-fullcone-iso
  cancel-in-progress: false

env:
  BUILD_BY: homerouter@github.com

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: vyos/vyos-build:rolling
      options: --sysctl net.ipv6.conf.lo.disable_ipv6=0 --privileged
    outputs:
      kernel: ${{ steps.packages.outputs.kernel }}
      kernel_tag: ${{ steps.packages.outputs.kernel_tag }}
      version: ${{ steps.meta.outputs.version }}
      vyos_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout current VyOS rolling builder
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          ref: rolling
          path: vyos-build

      - name: Record VyOS source
        id: source
        working-directory: vyos-build
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download verified Fullcone packages
        id: packages
        working-directory: vyos-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          download() {
            url=$1
            sha256=$2
            file="packages/${url##*/}"
            curl -fL --retry 3 -o "$file" "$url"
            echo "$sha256  $file" | sha256sum --check -
          }

          download https://github.com/homerouter/libnftnl-fullcone/releases/download/1.3.2-1/libnftnl11_1.3.2-1_amd64.deb \
            0b8d23f7cb0b190213a862002baf51ab5ff8f0e5e081b8a0edd7f082553a7158
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1/libnftables1_1.1.7-1_amd64.deb \
            ef911f2b628e40434d18adc0bebdc82ed75994bc971a52d84304c3e215e4d45e
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1/nftables_1.1.7-1_amd64.deb \
            dc32985b2d69de10a87e63a26d9251d485ec07eb6945d81ee959b28fa1610175
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1/python3-nftables_1.1.7-1_amd64.deb \
            0e417650415283de6b4f7df744509f963edcf2bd9f71531304c22c1b28fc7e7f

          kernel=$(sed -n 's/^kernel_version = "\([^"]*\)"/\1/p' data/defaults.toml)
          test -n "$kernel"
          releases=$(mktemp)
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/homerouter/vyos-kernel-rolling/releases?per_page=100 \
            > "$releases"
          match=$(jq -er --arg prefix "linux-image-${kernel}-vyos_" '
            [ .[] as $release
              | $release.assets[]
              | select((.name | startswith($prefix)) and (.name | endswith("_amd64.deb")))
              | { tag: $release.tag_name, asset: . }
            ][0]
          ' "$releases")
          name=$(jq -r '.asset.name' <<< "$match")
          url=$(jq -r '.asset.browser_download_url' <<< "$match")
          digest=$(jq -r '.asset.digest // empty' <<< "$match")
          test "${digest%%:*}" = sha256
          curl -fL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
            -o "packages/$name" "$url"
          echo "${digest#sha256:}  packages/$name" | sha256sum --check -
          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"
          echo "kernel_tag=$(jq -r '.tag' <<< "$match")" >> "$GITHUB_OUTPUT"

      - name: Build ISO
        id: meta
        working-directory: vyos-build
        shell: bash
        run: |
          set -euo pipefail
          version="1.5-rolling-fullcone-$(date -u +'%Y%m%d-%H%M')-${GITHUB_RUN_NUMBER}"
          sudo --preserve-env ./build-vyos-image \
            --architecture amd64 \
            --build-by "$BUILD_BY" \
            --build-type release \
            --version "$version" \
            generic
          mv build/live-image-amd64.hybrid.iso "build/vyos-${version}-amd64.iso"
          mv build/manifest.json "build/vyos-${version}-manifest.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify ISO contents
        working-directory: vyos-build
        shell: bash
        run: |
          set -euo pipefail
          iso="build/vyos-${{ steps.meta.outputs.version }}-amd64.iso"
          squashfs=$(mktemp --suffix=.squashfs)
          xorriso -osirrox on -indev "$iso" \
            -extract /live/filesystem.squashfs "$squashfs"
          dpkgdb=$(mktemp -d)
          unsquashfs -cat "$squashfs" var/lib/dpkg/status > "$dpkgdb/status"
          check_version() {
            actual=$(dpkg-query --admindir="$dpkgdb" --showformat='${Version}' --show "$1")
            test "$actual" = "$2"
          }
          check_version libnftnl11 1.3.2-1
          check_version libnftables1 1.1.7-1
          check_version nftables 1.1.7-1
          check_version python3-nftables 1.1.7-1
          check_version "linux-image-${{ steps.packages.outputs.kernel }}-vyos" \
            "${{ steps.packages.outputs.kernel }}-1"
          unsquashfs -ll "$squashfs" > squashfs-files.txt
          grep -Eq '/nft_fullcone\.ko(\.(xz|zst|gz))?$' squashfs-files.txt

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: vyos-${{ steps.meta.outputs.version }}
          path: |
            vyos-build/build/vyos-${{ steps.meta.outputs.version }}-amd64.iso
            vyos-build/build/vyos-${{ steps.meta.outputs.version }}-manifest.json
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download ISO
        uses: actions/download-artifact@v8
        with:
          name: vyos-${{ needs.build.outputs.version }}
          path: release

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          gh release create "v$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "VyOS $VERSION" \
            --notes "VyOS source: ${{ needs.build.outputs.vyos_sha }}
          Fullcone kernel: ${{ needs.build.outputs.kernel_tag }}
          libnftnl: 1.3.2-1
          nftables: 1.1.7-1" \
            --prerelease
