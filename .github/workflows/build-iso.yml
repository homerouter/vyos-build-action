name: Build VyOS rolling Fullcone ISO

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vyos-rolling-fullcone-iso
  cancel-in-progress: false

env:
  BUILD_BY: homerouter@github.com

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: vyos/vyos-build:rolling
      options: --sysctl net.ipv6.conf.lo.disable_ipv6=0 --privileged
    outputs:
      kernel: ${{ steps.packages.outputs.kernel }}
      kernel_tag: ${{ steps.packages.outputs.kernel_tag }}
      qat_version: ${{ steps.packages.outputs.qat_version }}
      firmware_version: ${{ steps.packages.outputs.firmware_version }}
      version: ${{ steps.meta.outputs.version }}
      vyos_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout current VyOS rolling builder
        uses: actions/checkout@v6
        with:
          repository: vyos/vyos-build
          ref: rolling
          path: vyos-build

      - name: Record VyOS source
        id: source
        working-directory: vyos-build
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download verified Fullcone packages
        id: packages
        working-directory: vyos-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          download() {
            url=$1
            sha256=$2
            file="packages/${url##*/}"
            curl -fL --retry 3 -o "$file" "$url"
            echo "$sha256  $file" | sha256sum --check -
          }

          download https://github.com/homerouter/libnftnl-fullcone/releases/download/1.3.2-1/libnftnl11_1.3.2-1_amd64.deb \
            0b8d23f7cb0b190213a862002baf51ab5ff8f0e5e081b8a0edd7f082553a7158
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1-bookworm.1/libnftables1_1.1.7-1_amd64.deb \
            378bf73cfb88845941c82c05796825110518bdb20743dd36898c1b69414fc932
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1-bookworm.1/nftables_1.1.7-1_amd64.deb \
            1f349fc86dfceb91d187ca3cb83cbb749de12ebfb44f648e57fb08518c15f381
          download https://github.com/homerouter/nftables-fullcone/releases/download/1.1.7-1-bookworm.1/python3-nftables_1.1.7-1_amd64.deb \
            a8e3e6735e0a34ff650fbe7767ba8742746a7558a049d3fbf7f06062b4b1eba0

          kernel=$(sed -n 's/^kernel_version = "\([^"]*\)"/\1/p' data/defaults.toml)
          test -n "$kernel"
          releases=$(mktemp)
          curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/homerouter/vyos-kernel-rolling/releases?per_page=100 \
            > "$releases"
          release=$(jq -cer --arg prefix "linux-image-${kernel}-vyos_" '
            [ .[]
              | select(.draft == false)
              | select(any(.assets[];
                  (.name | startswith($prefix)) and (.name | endswith("_amd64.deb"))))
            ][0]
          ' "$releases")
          for prefix in "linux-image-${kernel}-vyos_" vyos-intel-qat_ vyos-linux-firmware_; do
            asset=$(jq -cer --arg prefix "$prefix" '
              [ .assets[]
                | select((.name | startswith($prefix)) and (.name | endswith("_amd64.deb")))
              ] | if length == 1 then .[0] else error("missing or duplicate package") end
            ' <<< "$release")
            name=$(jq -r '.name' <<< "$asset")
            url=$(jq -r '.browser_download_url' <<< "$asset")
            digest=$(jq -r '.digest // empty' <<< "$asset")
            test "${digest%%:*}" = sha256
            curl -fL --retry 3 -H "Authorization: Bearer $GITHUB_TOKEN" \
              -o "packages/$name" "$url"
            echo "${digest#sha256:}  packages/$name" | sha256sum --check -
          done

          qat=$(find packages -maxdepth 1 -type f -name 'vyos-intel-qat_*.deb' -print -quit)
          firmware=$(find packages -maxdepth 1 -type f -name 'vyos-linux-firmware_*.deb' -print -quit)
          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"
          echo "kernel_tag=$(jq -r '.tag_name' <<< "$release")" >> "$GITHUB_OUTPUT"
          echo "qat_version=$(dpkg-deb --field "$qat" Version)" >> "$GITHUB_OUTPUT"
          echo "firmware_version=$(dpkg-deb --field "$firmware" Version)" >> "$GITHUB_OUTPUT"

      - name: Build ISO
        id: meta
        working-directory: vyos-build
        shell: bash
        run: |
          set -euo pipefail
          version="1.5-rolling-fullcone-$(date -u +'%Y%m%d-%H%M')-${GITHUB_RUN_NUMBER}"
          sudo --preserve-env ./build-vyos-image \
            --architecture amd64 \
            --build-by "$BUILD_BY" \
            --build-type release \
            --version "$version" \
            generic
          mv build/live-image-amd64.hybrid.iso "build/vyos-${version}-amd64.iso"
          mv build/manifest.json "build/vyos-${version}-manifest.json"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify ISO contents
        working-directory: vyos-build
        shell: bash
        run: |
          set -euo pipefail
          iso="build/vyos-${{ steps.meta.outputs.version }}-amd64.iso"
          squashfs=$(mktemp --suffix=.squashfs)
          xorriso -osirrox on -indev "$iso" \
            -extract /live/filesystem.squashfs "$squashfs"
          dpkgdb=$(mktemp -d)
          unsquashfs -cat "$squashfs" var/lib/dpkg/status > "$dpkgdb/status"
          check_version() {
            actual=$(dpkg-query --admindir="$dpkgdb" --showformat='${Version}' --show "$1")
            test "$actual" = "$2"
          }
          check_version libnftnl11 1.3.2-1
          check_version libnftables1 1.1.7-1
          check_version nftables 1.1.7-1
          check_version python3-nftables 1.1.7-1
          check_version "linux-image-${{ steps.packages.outputs.kernel }}-vyos" \
            "${{ steps.packages.outputs.kernel }}-1"
          check_version vyos-intel-qat "${{ steps.packages.outputs.qat_version }}"
          check_version vyos-linux-firmware "${{ steps.packages.outputs.firmware_version }}"
          unsquashfs -ll "$squashfs" > squashfs-files.txt
          grep -Eq '/nft_fullcone\.ko(\.(xz|zst|gz))?$' squashfs-files.txt

      - name: Upload ISO
        uses: actions/upload-artifact@v7
        with:
          name: vyos-${{ steps.meta.outputs.version }}
          path: |
            vyos-build/build/vyos-${{ steps.meta.outputs.version }}-amd64.iso
            vyos-build/build/vyos-${{ steps.meta.outputs.version }}-manifest.json
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download ISO
        uses: actions/download-artifact@v8
        with:
          name: vyos-${{ needs.build.outputs.version }}
          path: release

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.event.repository.default_branch }}" \
            --title "VyOS $VERSION" \
            --notes "VyOS source: ${{ needs.build.outputs.vyos_sha }}
          Fullcone kernel: ${{ needs.build.outputs.kernel_tag }}
          Intel QAT: ${{ needs.build.outputs.qat_version }}
          Firmware: ${{ needs.build.outputs.firmware_version }}
          libnftnl: 1.3.2-1
          nftables: 1.1.7-1" \
            --draft
          gh release upload "v$VERSION" release/* --repo "$GITHUB_REPOSITORY"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease
