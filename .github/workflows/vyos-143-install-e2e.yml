name: VyOS 1.4.3 install E2E

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: vyos-test-images
  ISO_143: vyos-1.4.3-generic-amd64.iso
  DISK: vyos-143-e2e.qcow2

jobs:
  install-test:
    name: Install and boot VyOS 1.4.3
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils expect curl file xorriso

      - name: Download VyOS 1.4.3 ISO
        shell: bash
        run: |
          set -euxo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "${ISO_143}" "${base}/${ISO_143}"
          test -s "${ISO_143}"
          ls -lh "${ISO_143}"
          file "${ISO_143}"
          sha256sum "${ISO_143}" | tee iso-sha256.txt

      - name: Extract live kernel and initrd
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p live-boot
          xorriso -osirrox on -indev "${ISO_143}" \
            -extract /live/vmlinuz live-boot/vmlinuz \
            -extract /live/initrd.img live-boot/initrd.img
          test -s live-boot/vmlinuz
          test -s live-boot/initrd.img
          ls -lh live-boot/vmlinuz live-boot/initrd.img
          file live-boot/vmlinuz live-boot/initrd.img

      - name: Create target disk
        shell: bash
        run: |
          set -euxo pipefail
          qemu-img create -f qcow2 "${DISK}" 8G
          qemu-img info "${DISK}"

      - name: Create installer driver
        shell: bash
        run: |
          cat > install143.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 600
          log_user 1
          log_file -a install143-transcript.log

          set iso  $env(ISO_143)
          set disk $env(DISK)

          proc die {msg} {
              puts stderr "\nERROR: $msg"
              exit 1
          }
          proc line {s} {
              send -- "$s\r"
          }

          # Direct kernel boot deliberately bypasses ISOLINUX.  ttyS0 is the
          # final console= argument, making it the primary system console.
          spawn qemu-system-x86_64 \
              -machine accel=tcg \
              -cpu max \
              -m 2048 \
              -smp 2 \
              -drive file=$disk,if=virtio,format=qcow2 \
              -drive file=$iso,media=cdrom,readonly=on \
              -kernel live-boot/vmlinuz \
              -initrd live-boot/initrd.img \
              -append {boot=live components hostname=vyos username=live nopersistence noautologin nonetworking union=overlay net.ifnames=0 biosdevname=0 console=tty0 console=ttyS0,115200} \
              -nographic \
              -no-reboot

          expect {
              -re {(?i)vyos login:\s*$} { line "vyos" }
              timeout { die "VyOS 1.4.3 live login prompt not reached" }
              eof { die "QEMU exited before live login" }
          }
          expect {
              -re {(?i)password:\s*$} { line "vyos" }
              timeout { die "live password prompt not reached" }
              eof { die "QEMU exited during live login" }
          }
          expect {
              -re {vyos@vyos[^\r\n]*[$#]\s*$} { line "install image" }
              timeout { die "VyOS live shell not reached" }
              eof { die "QEMU exited before live shell" }
          }

          # Native VyOS 1.4.3 installer prompts.
          expect {
              -re {Would you like to continue\?\s*\[y/N\]\s*$} { line "y" }
              timeout { die "installer confirmation prompt not reached" }
              eof { die "QEMU exited at installer confirmation" }
          }
          expect {
              -re {What would you like to name this image\?.*Default:\s*1\.4\.3.*\)\s*$} { line "" }
              timeout { die "image-name prompt not reached" }
              eof { die "QEMU exited at image-name prompt" }
          }
          expect {
              -re {Please enter a password for the "vyos" user:\s*$} { line "vyos" }
              timeout { die "new password prompt not reached" }
              eof { die "QEMU exited at new password prompt" }
          }
          expect {
              -re {Please confirm password for the "vyos" user:\s*$} { line "vyos" }
              timeout { die "password confirmation prompt not reached" }
              eof { die "QEMU exited at password confirmation" }
          }
          expect {
              -re {What console should be used by default\?.*Default:\s*S.*\)\s*$} { line "" }
              timeout { die "default-console prompt not reached" }
              eof { die "QEMU exited at console prompt" }
          }
          expect {
              -re {Which one should be used for installation\?.*Default:\s*/dev/vda.*\)\s*$} { line "" }
              timeout { die "installation disk prompt not reached" }
              eof { die "QEMU exited at disk selection" }
          }

          # Remaining 1.4.x prompts vary slightly between builds.  Answer
          # defaults for sizing/copy-config questions and explicitly confirm
          # destructive operations.
          set installed 0
          while {!$installed} {
              expect {
                  -re {(?i)(how big.*root|root partition.*size|partition.*size).*default.*\)\s*$} {
                      line ""
                  }
                  -re {(?i)(which partition|partition.*install).*default.*\)\s*$} {
                      line ""
                  }
                  -re {(?i)(copy.*config|configuration.*copy).*\[Y/n\]\s*$} {
                      line ""
                  }
                  -re {(?i)(all data|destroy|delete|format|partition).*(continue|proceed|sure).*\[y/N\]\s*$} {
                      line "y"
                  }
                  -re {(?i)(continue|proceed).*\[y/N\]\s*$} {
                      line "y"
                  }
                  -re {(?i)(installation completed successfully|installation complete|installed successfully)} {
                      set installed 1
                  }
                  -re {vyos@vyos[^\r\n]*[$#]\s*$} {
                      set installed 1
                  }
                  timeout { die "installer did not complete within timeout" }
                  eof { die "QEMU exited before installation completed" }
              }
          }

          # Ensure we have a shell prompt, sync the target, then power down.
          line ""
          expect {
              -re {vyos@vyos[^\r\n]*[$#]\s*$} { line "sync" }
              timeout { die "live shell not available after installation" }
              eof { die "QEMU exited immediately after installation" }
          }
          expect {
              -re {vyos@vyos[^\r\n]*[$#]\s*$} { line "sudo poweroff" }
              timeout { die "sync did not return to shell" }
              eof { exit 0 }
          }
          expect {
              -re {(?i)(power down|reboot: power down|system halted)} { exit 0 }
              eof { exit 0 }
              timeout {
                  # Ctrl-A X terminates QEMU's -nographic frontend after disk sync.
                  send -- "\001x"
                  exit 0
              }
          }
          EXPECT
          chmod +x install143.exp

      - name: Install VyOS 1.4.3
        shell: bash
        run: |
          set -euxo pipefail
          : > install143-transcript.log
          timeout 1200 ./install143.exp
          qemu-img info "${DISK}"
          qemu-img check "${DISK}"
          ls -lh "${DISK}"

          # A successful installation must have actually allocated data.
          actual_size="$(stat -c '%s' "${DISK}")"
          if (( actual_size < 10000000 )); then
            echo "ERROR: qcow2 is unexpectedly small after installation: ${actual_size} bytes" >&2
            exit 1
          fi

      - name: Create installed-system verifier
        shell: bash
        run: |
          cat > verify143.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 300
          log_user 1
          log_file -a verify143-transcript.log

          set disk $env(DISK)
          proc die {msg} {
              puts stderr "\nERROR: $msg"
              exit 1
          }
          proc line {s} { send -- "$s\r" }

          spawn qemu-system-x86_64 \
              -machine accel=tcg \
              -cpu max \
              -m 2048 \
              -smp 2 \
              -drive file=$disk,if=virtio,format=qcow2 \
              -boot c \
              -nographic \
              -no-reboot

          expect {
              -re {(?i)vyos login:\s*$} { line "vyos" }
              timeout { die "installed VyOS login prompt not reached" }
              eof { die "installed VM exited before login" }
          }
          expect {
              -re {(?i)password:\s*$} { line "vyos" }
              timeout { die "installed VyOS password prompt not reached" }
              eof { die "installed VM exited during login" }
          }
          expect {
              -re {vyos@[^\r\n]*[$#]\s*$} { line "show version" }
              timeout { die "installed VyOS shell not reached" }
              eof { die "installed VM exited before shell" }
          }
          expect {
              -re {Version:\s*VyOS\s+1\.4\.3|VyOS\s+1\.4\.3} { }
              timeout { die "installed system did not report VyOS 1.4.3" }
              eof { die "installed VM exited before version verification" }
          }

          # Wait for prompt again before shutting down.
          expect {
              -re {vyos@[^\r\n]*[$#]\s*$} { line "sudo poweroff" }
              timeout { die "shell prompt did not return after show version" }
              eof { exit 0 }
          }
          expect {
              -re {(?i)(power down|reboot: power down|system halted)} { exit 0 }
              eof { exit 0 }
              timeout {
                  send -- "\001x"
                  exit 0
              }
          }
          EXPECT
          chmod +x verify143.exp

      - name: Boot installed disk and verify 1.4.3
        shell: bash
        run: |
          set -euxo pipefail
          : > verify143-transcript.log
          timeout 600 ./verify143.exp

      - name: Final disk diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "======================================================"
          echo " qcow2 diagnostics"
          echo "======================================================"
          qemu-img info "${DISK}" || true
          qemu-img check "${DISK}" || true
          ls -lh "${DISK}" || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyos-143-install-e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            install143-transcript.log
            verify143-transcript.log
            iso-sha256.txt
            install143.exp
            verify143.exp
