name: VyOS 1.4.3 install E2E

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: vyos-test-images
  ISO_143: vyos-1.4.3-generic-amd64.iso
  DISK: vyos-143-e2e.qcow2

jobs:
  install-143:
    name: Install and boot VyOS 1.4.3
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils expect curl file libarchive-tools

      - name: Download VyOS 1.4.3 ISO
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "${ISO_143}" "${base}/${ISO_143}"
          test -s "${ISO_143}"
          file "${ISO_143}"
          sha256sum "${ISO_143}" | tee iso-sha256.txt

      - name: Create target disk
        shell: bash
        run: |
          set -euxo pipefail
          qemu-img create -f qcow2 "${DISK}" 8G

      - name: Extract live kernel, initrd, squashfs and ISO boot arguments
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf iso-root live-root
          mkdir -p iso-root live-root
          bsdtar -xf "${ISO_143}" -C iso-root

          cp iso-root/live/vmlinuz live-root/vmlinuz
          cp iso-root/live/initrd.img live-root/initrd.img
          cp iso-root/live/filesystem.squashfs live-root/filesystem.squashfs

          echo '===== boot config candidates ====='
          find iso-root -maxdepth 4 -type f \( \
            -iname 'isolinux.cfg' -o -iname '*.cfg' -o -iname 'grub.cfg' \
          \) -print | sort

          echo '===== ISO boot config ====='
          grep -RniE '(^|[[:space:]])(append|linux|linuxefi)[[:space:]]|boot=live' \
            iso-root/isolinux iso-root/boot iso-root/EFI 2>/dev/null || true

          # Sagitta's live image uses these live-build arguments.  Preserve the
          # live ISO contract and add live-media-path because QEMU will expose
          # the extracted live files on a small FAT disk rather than a CD-ROM.
          cat > live-root/cmdline.txt <<'EOF'
          BOOT_IMAGE=/live/vmlinuz boot=live components hostname=vyos username=live nopersistence noautologin nonetworking union=overlay live-media-path=/live console=ttyS0,115200 net.ifnames=0 biosdevname=0
          EOF
          sed -i 's/^[[:space:]]*//' live-root/cmdline.txt
          cat live-root/cmdline.txt

          # Make a live-media disk. Direct -kernel boot with only the initrd is
          # insufficient: live-boot must still be able to find filesystem.squashfs.
          truncate -s 1G live-media.img
          mkfs.vfat live-media.img
          mkdir -p /tmp/live-media
          sudo mount -o loop live-media.img /tmp/live-media
          sudo mkdir -p /tmp/live-media/live
          sudo cp live-root/filesystem.squashfs /tmp/live-media/live/filesystem.squashfs
          sync
          sudo umount /tmp/live-media

      - name: Write installer Expect driver
        shell: bash
        run: |
          cat > install143.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 600
          log_user 1
          log_file -a install143-transcript.log

          set disk $env(DISK)
          set fp [open "live-root/cmdline.txt" r]
          set cmdline [string trim [read $fp]]
          close $fp

          proc die {msg} {
              puts stderr "\nERROR: $msg"
              exit 1
          }
          proc line {s} { send -- "$s\r" }

          spawn qemu-system-x86_64 \
              -machine accel=tcg \
              -cpu max \
              -m 2048 \
              -smp 2 \
              -kernel live-root/vmlinuz \
              -initrd live-root/initrd.img \
              -append $cmdline \
              -drive file=live-media.img,if=virtio,format=raw,readonly=on \
              -drive file=$disk,if=virtio,format=qcow2 \
              -nographic \
              -no-reboot

          # Do not require the prompt to end the Expect buffer: systemd and
          # service messages can race with getty output on ttyS0.
          expect {
              -re {(?i)vyos login:} { line "vyos" }
              timeout { die "VyOS 1.4.3 live login prompt not reached" }
              eof { die "QEMU exited before live login" }
          }
          expect {
              -re {(?i)password:} { line "vyos" }
              timeout { die "live password prompt not reached" }
              eof { die "QEMU exited during live login" }
          }
          expect {
              -re {vyos@vyos[^\r\n]*[$#]} { line "install image" }
              timeout { die "VyOS live shell not reached" }
              eof { die "QEMU exited before live shell" }
          }

          # 1.4.3 installer. Match semantic fragments so terminal wrapping does
          # not break automation.
          expect {
              -re {Would you like to continue\?.*\[y/N\]} { line "y" }
              timeout { die "installer confirmation prompt not reached" }
              eof { die "QEMU exited at installer confirmation" }
          }
          expect {
              -re {What would you like to name this image\?} { line "" }
              timeout { die "image-name prompt not reached" }
              eof { die "QEMU exited at image-name prompt" }
          }
          expect {
              -re {Please enter a password for the "vyos" user:} { line "vyos" }
              timeout { die "new password prompt not reached" }
              eof { die "QEMU exited at password prompt" }
          }
          expect {
              -re {Please confirm password for the "vyos" user:} { line "vyos" }
              timeout { die "password confirmation prompt not reached" }
              eof { die "QEMU exited at password confirmation" }
          }
          expect {
              -re {What console should be used by default\?} { line "" }
              timeout { die "console prompt not reached" }
              eof { die "QEMU exited at console prompt" }
          }
          expect {
              -re {Which one should be used for installation\?} { line "" }
              timeout { die "disk selection prompt not reached" }
              eof { die "QEMU exited at disk selection" }
          }

          # Remaining 1.4 installer questions differ slightly between builds.
          # Defaults are correct for this disposable single-disk VM.
          set installed 0
          while {!$installed} {
              expect {
                  -re {(?i)(root partition|partition size|how big).*\(Default:.*\)} {
                      line ""
                  }
                  -re {(?i)(all data|destroy|delete|format|partition).*\[y/N\]} {
                      line "y"
                  }
                  -re {(?i)(continue|proceed).*\[y/N\]} {
                      line "y"
                  }
                  -re {(?i)(installation completed successfully|installation complete|installed successfully)} {
                      set installed 1
                  }
                  -re {vyos@vyos[^\r\n]*[$#]} {
                      set installed 1
                  }
                  timeout { die "installer stalled after disk selection" }
                  eof { die "QEMU exited before installation completed" }
              }
          }

          line ""
          expect {
              -re {vyos@vyos[^\r\n]*[$#]} { line "sync" }
              timeout { die "live shell not available after installation" }
              eof { die "QEMU exited after installation" }
          }
          expect {
              -re {vyos@vyos[^\r\n]*[$#]} { line "sudo poweroff" }
              timeout { die "sync did not return to shell" }
              eof { exit 0 }
          }
          expect {
              eof { exit 0 }
              timeout { exit 0 }
          }
          EXPECT
          chmod +x install143.exp

      - name: Install VyOS 1.4.3
        shell: bash
        run: |
          set -euxo pipefail
          : > install143-transcript.log
          timeout 1200 ./install143.exp
          qemu-img info "${DISK}"
          ls -lh "${DISK}"

      - name: Write installed-image verifier
        shell: bash
        run: |
          cat > verify143.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 420
          log_user 1
          log_file -a verify143-transcript.log
          set disk $env(DISK)

          proc die {msg} {
              puts stderr "\nERROR: $msg"
              exit 1
          }
          proc line {s} { send -- "$s\r" }

          spawn qemu-system-x86_64 \
              -machine accel=tcg \
              -cpu max \
              -m 2048 \
              -smp 2 \
              -drive file=$disk,if=virtio,format=qcow2 \
              -nographic \
              -no-reboot

          expect {
              -re {(?i)vyos login:} { line "vyos" }
              timeout { die "installed VyOS login prompt not reached" }
              eof { die "installed VM exited before login" }
          }
          expect {
              -re {(?i)password:} { line "vyos" }
              timeout { die "installed password prompt not reached" }
              eof { die "installed VM exited during login" }
          }
          expect {
              -re {vyos@vyos[^\r\n]*[$#]} { line "show version" }
              timeout { die "installed shell not reached" }
              eof { die "installed VM exited before shell" }
          }
          expect {
              -re {Version:[[:space:]]+VyOS[[:space:]]+1\.4\.3} {}
              timeout { die "installed system did not report VyOS 1.4.3" }
              eof { die "installed VM exited before version verification" }
          }
          expect {
              -re {vyos@vyos[^\r\n]*[$#]} { line "sudo poweroff" }
              timeout { die "shell did not return after show version" }
              eof { exit 0 }
          }
          expect {
              eof { exit 0 }
              timeout { exit 0 }
          }
          EXPECT
          chmod +x verify143.exp

      - name: Boot installed disk and verify 1.4.3
        shell: bash
        run: |
          set -euxo pipefail
          : > verify143-transcript.log
          timeout 900 ./verify143.exp

      - name: Disk diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          qemu-img info "${DISK}"
          qemu-img check "${DISK}"
          ls -lh "${DISK}"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyos-143-install-e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            install143-transcript.log
            verify143-transcript.log
            iso-sha256.txt
            live-root/cmdline.txt
            install143.exp
            verify143.exp
