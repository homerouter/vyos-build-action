name: VyOS 1.4.3 -> 1.5.1 real VM E2E

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: vyos-test-images
  ISO_143: vyos-1.4.3-generic-amd64.iso
  ISO_151: vyos-1.5.1-generic-amd64.iso
  DISK: vyos-e2e.qcow2
  SERIAL: serial.sock
  QEMU_PID: qemu.pid

jobs:
  e2e:
    name: VyOS 1.4.3 -> 1.5.1 real VM E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils socat expect curl file

      - name: Download release ISOs
        run: |
          set -euxo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl -fL --retry 5 --retry-delay 2 -o "$ISO_143" "$base/$ISO_143"
          curl -fL --retry 5 --retry-delay 2 -o "$ISO_151" "$base/$ISO_151"
          test -s "$ISO_143"
          test -s "$ISO_151"
          file "$ISO_143" "$ISO_151"
          sha256sum "$ISO_143" "$ISO_151" | tee iso-sha256.txt

      - name: Create disk
        run: qemu-img create -f qcow2 "$DISK" 8G

      - name: Create VM tools
        run: |
          cat > qemu-helper.sh <<'SH'
          #!/bin/bash
          set -euo pipefail
          case "$1" in
            start)
              iso="${2:-}"
              boot="${3:-c}"
              rm -f "$SERIAL" "$QEMU_PID"
              args=(-machine accel=kvm:tcg -cpu max -m 2048 -smp 2
                    -drive "file=$DISK,if=virtio,format=qcow2"
                    -boot "$boot" -display none
                    -serial "unix:$SERIAL,server=on,wait=off"
                    -monitor none -no-reboot)
              [[ -n "$iso" ]] && args+=(-cdrom "$iso")
              qemu-system-x86_64 "${args[@]}" &
              echo $! > "$QEMU_PID"
              for i in $(seq 1 30); do
                [[ -S "$SERIAL" ]] && exit 0
                sleep 1
              done
              exit 1
              ;;
            stop)
              if [[ -f "$QEMU_PID" ]]; then
                kill "$(cat "$QEMU_PID")" 2>/dev/null || true
                sleep 2
                kill -9 "$(cat "$QEMU_PID")" 2>/dev/null || true
              fi
              rm -f "$SERIAL" "$QEMU_PID"
              ;;
          esac
          SH
          chmod +x qemu-helper.sh

      - name: Create expect driver
        run: |
          cat > vm.exp <<'EXP'
          #!/usr/bin/expect -f
          set timeout 900
          log_user 1
          log_file -a $env(LOGFILE)
          spawn socat STDIO UNIX-CONNECT:$env(SERIAL)

          proc sendln {s} { send -- "$s\r" }
          proc die {s} { puts stderr "\nERROR: $s"; exit 1 }

          proc login {} {
            expect {
              -re {(?i)vyos login: *$} { sendln "vyos" }
              timeout { die "login prompt not reached" }
              eof { die "console closed before login" }
            }
            expect {
              -re {(?i)password: *$} { sendln "vyos" }
              timeout { die "password prompt not reached" }
            }
            expect {
              -re {vyos@[^#$]*[$#] *$} {}
              timeout { die "shell not reached" }
            }
          }

          set mode [lindex $argv 0]
          login

          if {$mode eq "install143"} {
            sendln "install image"
            set done 0
            while {!$done} {
              expect {
                -re {Would you like to continue.*\[y/N\]} { sendln "y" }
                -re {What would you like to name this image.*} { sendln "" }
                -re {Please enter a password for the "vyos" user:} { sendln "vyos" }
                -re {Please confirm password for the "vyos" user:} { sendln "vyos" }
                -re {What console should be used by default.*} { sendln "S" }
                -re {Which one should be used for installation.*} { sendln "/dev/vda" }
                -re {Installation will delete all data.*\[y/N\]} { sendln "y" }
                -re {Would you like to use all the free space.*} { sendln "y" }
                -re {How big of a root partition.*} { sendln "" }
                -re {What would you like to use as boot config.*} { sendln "" }
                -re {(?i)(installed successfully|installation completed successfully|done!)} { set done 1 }
                timeout { die "timeout during 1.4.3 installation" }
                eof { die "console closed during installation" }
              }
            }
            exit 0
          }

          if {$mode eq "verify143"} {
            sendln "show version"
            expect {
              -re {1\.4\.3} {}
              timeout { die "running system is not 1.4.3" }
            }
            exit 0
          }

          if {$mode eq "add151"} {
            sendln "sudo mkdir -p /mnt/e2e151"
            expect -re {vyos@[^#$]*[$#] *$}

            sendln "sudo mount -o ro /dev/sr0 /mnt/e2e151"
            expect {
              -re {vyos@[^#$]*[$#] *$} {}
              timeout { die "1.5.1 CD mount failed" }
            }

            sendln "cat /mnt/e2e151/version.json"
            expect {
              -re {"version":[ ]*"1\.5\.1"} {}
              timeout { die "attached CD is not 1.5.1" }
            }
            expect -re {vyos@[^#$]*[$#] *$}

            sendln "sudo cp /dev/sr0 /tmp/vyos-1.5.1.iso"
            expect {
              -re {vyos@[^#$]*[$#] *$} {}
              timeout { die "ISO copy timed out" }
            }

            sendln "sudo /usr/libexec/vyos/op_mode/image_installer.py --action add --image-path /tmp/vyos-1.5.1.iso --no-prompt"
            expect {
              -re {vyos@[^#$]*[$#] *$} {}
              -re {Traceback} { die "image installer traceback" }
              -re {(?i)compatibility check failed} { die "compatibility rejected" }
              timeout { die "add system image timed out" }
            }

            sendln "show system image"
            expect {
              -re {1\.5\.1} {}
              timeout { die "1.5.1 absent from image list" }
            }
            expect -re {vyos@[^#$]*[$#] *$}

            sendln "set system image default-boot 1.5.1"
            expect {
              -re {vyos@[^#$]*[$#] *$} {}
              timeout { die "could not select 1.5.1 default boot" }
            }
            exit 0
          }

          if {$mode eq "verify151"} {
            sendln "show version"
            expect {
              -re {1\.5\.1} {}
              timeout { die "running system is not 1.5.1" }
            }
            exit 0
          }

          die "unknown mode"
          EXP
          chmod +x vm.exp

      - name: Install VyOS 1.4.3
        env:
          LOGFILE: install143.log
        run: |
          set -euxo pipefail
          ./qemu-helper.sh start "$ISO_143" d
          ./vm.exp install143

      - name: Stop live VM
        if: always()
        run: ./qemu-helper.sh stop || true

      - name: Verify installed 1.4.3
        env:
          LOGFILE: verify143.log
        run: |
          set -euxo pipefail
          ./qemu-helper.sh start "" c
          ./vm.exp verify143

      - name: Stop 1.4.3 verification VM
        if: always()
        run: ./qemu-helper.sh stop || true

      - name: Add VyOS 1.5.1 through native image installer
        env:
          LOGFILE: add151.log
        run: |
          set -euxo pipefail
          # Disk remains first boot device; 1.5.1 is attached only as CD media.
          ./qemu-helper.sh start "$ISO_151" c
          ./vm.exp add151

      - name: Stop upgrade VM
        if: always()
        run: ./qemu-helper.sh stop || true

      - name: Verify boot into VyOS 1.5.1
        env:
          LOGFILE: verify151.log
        run: |
          set -euxo pipefail
          ./qemu-helper.sh start "" c
          ./vm.exp verify151
          echo "PASS: real VyOS 1.4.3 -> 1.5.1 upgrade completed"

      - name: Stop final VM
        if: always()
        run: ./qemu-helper.sh stop || true

      - name: Show diagnostics
        if: always()
        run: |
          for f in install143.log verify143.log add151.log verify151.log; do
            if [[ -s "$f" ]]; then
              echo "===== $f ====="
              tail -300 "$f"
            fi
          done

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyos-143-to-151-e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            install143.log
            verify143.log
            add151.log
            verify151.log
            iso-sha256.txt
            qemu-helper.sh
            vm.exp
