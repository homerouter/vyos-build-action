name: VyOS 1.4.3 to 1.5.1 E2E (serial)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: vyos-test-images
  VYOS_143_ISO: vyos-1.4.3-generic-amd64.iso
  VYOS_151_ISO: vyos-1.5.1-generic-amd64.iso
  VM_DISK: state/vyos-e2e.qcow2
  VM_MEM: "4096"
  VM_CPUS: "2"
  HTTP_PORT: "8000"

jobs:
  e2e:
    name: Real install 1.4.3 -> native add 1.5.1 -> boot 1.5.1
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils expect curl file socat python3

      - name: Prepare workspace
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p images logs state
          qemu-img create -f qcow2 "${VM_DISK}" 12G

      - name: Download cached test ISOs from release
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          curl --fail --location --retry 5 --retry-delay 3 \
            --output "images/${VYOS_143_ISO}" \
            "${BASE}/${VYOS_143_ISO}"

          curl --fail --location --retry 5 --retry-delay 3 \
            --output "images/${VYOS_151_ISO}" \
            "${BASE}/${VYOS_151_ISO}"

          test -s "images/${VYOS_143_ISO}"
          test -s "images/${VYOS_151_ISO}"
          file "images/${VYOS_143_ISO}" "images/${VYOS_151_ISO}"
          sha256sum "images/${VYOS_143_ISO}" "images/${VYOS_151_ISO}"

      - name: Create QEMU launcher
        shell: bash
        run: |
          set -euxo pipefail
          cat > state/start-qemu.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          MODE="${1:?mode required}"
          rm -f state/serial.sock state/monitor.sock state/qemu.pid

          args=(
            -name vyos-e2e
            -machine accel=kvm:tcg
            -cpu max
            -smp "${VM_CPUS}"
            -m "${VM_MEM}"
            -drive "file=${VM_DISK},if=virtio,format=qcow2,cache=writeback"
            -netdev user,id=net0
            -device virtio-net-pci,netdev=net0
            -display none
            -chardev socket,id=serial0,path=state/serial.sock,server=on,wait=off
            -serial chardev:serial0
            -monitor unix:state/monitor.sock,server=on,wait=off
            -pidfile state/qemu.pid
            -no-reboot
            -daemonize
          )

          if [[ "${MODE}" == "live" ]]; then
            args+=(
              -drive "file=images/${VYOS_143_ISO},media=cdrom,readonly=on"
              -boot d
            )
          else
            args+=( -boot c )
          fi

          qemu-system-x86_64 "${args[@]}"

          for _ in $(seq 1 30); do
            [[ -S state/serial.sock ]] && exit 0
            sleep 1
          done

          echo "ERROR: QEMU serial socket was not created" >&2
          exit 1
          SH
          chmod +x state/start-qemu.sh

      - name: Create serial console driver
        shell: bash
        run: |
          set -euxo pipefail
          cat > state/vyos-e2e.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 1200
          log_user 1

          proc fail {msg} {
              puts stderr "\nERROR: $msg"
              exit 1
          }

          proc wait_for_login {phase} {
              set timeout 360
              # We attach immediately after QEMU starts. CR also wakes/re-prompts getty.
              send -- "\r"
              expect {
                  -re {(?i)vyos login: ?$} { send -- "vyos\r" }
                  -re {vyos@[^\\r\\n]*[$#] ?$} { return }
                  -re {(?i)login timed out} { send -- "\r"; exp_continue }
                  timeout { fail "$phase: VyOS login prompt not reached" }
                  eof { fail "$phase: serial console closed before login" }
              }

              expect {
                  -re {(?i)password: ?$} { send -- "vyos\r" }
                  -re {vyos@[^\\r\\n]*[$#] ?$} { return }
                  timeout { fail "$phase: password prompt not reached" }
                  eof { fail "$phase: serial console closed at password prompt" }
              }

              expect {
                  -re {vyos@[^\\r\\n]*[$#] ?$} { return }
                  -re {(?i)login incorrect} { fail "$phase: vyos/vyos rejected" }
                  -re {(?i)login timed out} { fail "$phase: login timed out after password" }
                  timeout { fail "$phase: shell prompt not reached" }
                  eof { fail "$phase: serial console closed before shell" }
              }
          }

          proc verify_version {wanted phase} {
              set timeout 120
              send -- "show version\r"
              expect {
                  -re $wanted {}
                  timeout { fail "$phase: expected version not found" }
                  eof { fail "$phase: serial closed during show version" }
              }
              expect {
                  -re {vyos@[^\\r\\n]*[$#] ?$} {}
                  timeout { fail "$phase: prompt not returned after show version" }
                  eof { fail "$phase: serial closed after show version" }
              }
          }

          proc install_143 {} {
              set timeout 1200
              send -- "install image\r"
              set completed 0

              for {set i 0} {$i < 180 && !$completed} {incr i} {
                  expect {
                      -re {(?i)Would you like to continue\?\s*\[y/N\]} {
                          send -- "y\r"
                      }
                      -re {(?i)(What would you like to name this image|image name).*[:?]\s*$} {
                          send -- "\r"
                      }
                      -re {(?i)(Please select.*drive|Select.*drive|Which.*(?:disk|drive)|installation disk).*[:?]\s*$} {
                          send -- "vda\r"
                      }
                      -re {(?i)(destroy all data|all data.*(?:lost|destroyed)|This will destroy).*\[(?:y/N|Y/n)\]} {
                          send -- "y\r"
                      }
                      -re {(?i)(partition size|root partition).*[:?]\s*$} {
                          send -- "\r"
                      }
                      -re {(?i)(keep.*configuration|copy.*configuration).*\[(?:y/N|Y/n)\]} {
                          send -- "n\r"
                      }
                      -re {(?i)(Enter|Set).*password.*:\s*$} {
                          send -- "vyos\r"
                      }
                      -re {(?i)(Retype|Repeat|Confirm|Re-enter).*password.*:\s*$} {
                          send -- "vyos\r"
                      }
                      -re {(?i)(Which drive should GRUB|install GRUB|bootloader.*drive).*[:?]\s*$} {
                          send -- "vda\r"
                      }
                      -re {(?i)(Installation complete|Installation completed|successfully installed|installation has completed)} {
                          set completed 1
                      }
                      -re {vyos@[^\\r\\n]*[$#] ?$} {
                          set completed 1
                      }
                      timeout { fail "timeout while installing VyOS 1.4.3" }
                      eof { fail "serial console closed during VyOS 1.4.3 installation" }
                  }
              }

              if {!$completed} {
                  fail "VyOS 1.4.3 installer did not complete"
              }
          }

          proc native_add_151 {} {
              set timeout 1200
              set url "http://10.0.2.2:8000/vyos-1.5.1-generic-amd64.iso"
              send -- "add system image $url\r"
              set completed 0

              for {set i 0} {$i < 150 && !$completed} {incr i} {
                  expect {
                      -re {(?i)(Would you like to continue|continue with installation).*\[(?:y/N|Y/n)\]} {
                          send -- "y\r"
                      }
                      -re {(?i)(What would you like to name this image|image name).*[:?]\s*$} {
                          send -- "\r"
                      }
                      -re {(?i)(keep.*configuration|copy.*configuration).*\[(?:y/N|Y/n)\]} {
                          send -- "y\r"
                      }
                      -re {(?i)(Image.*(?:added|installed).*successfully|Installation complete|Installation completed)} {
                          set completed 1
                      }
                      -re {vyos@[^\\r\\n]*[$#] ?$} {
                          set completed 1
                      }
                      -re {(?i)(compatibility check failed|incompatible image|cannot check compatibility)} {
                          fail "native add system image rejected VyOS 1.5.1"
                      }
                      timeout { fail "timeout while adding VyOS 1.5.1" }
                      eof { fail "serial console closed while adding VyOS 1.5.1" }
                  }
              }

              if {!$completed} {
                  fail "native add system image did not complete"
              }

              send -- "show system image\r"
              expect {
                  -re {1\.5\.1} {}
                  timeout { fail "1.5.1 absent from show system image" }
                  eof { fail "serial closed during show system image" }
              }
              expect {
                  -re {vyos@[^\\r\\n]*[$#] ?$} {}
                  timeout { fail "prompt not returned after show system image" }
                  eof { fail "serial closed after show system image" }
              }
          }

          proc poweroff_vm {} {
              set timeout 180
              send -- "sudo poweroff\r"
              expect {
                  eof { return }
                  timeout { return }
              }
          }

          set mode [lindex $argv 0]
          set socket [lindex $argv 1]
          set logfile [lindex $argv 2]

          if {$mode eq "" || $socket eq "" || $logfile eq ""} {
              fail "usage: vyos-e2e.exp MODE SOCKET LOGFILE"
          }

          log_file -a $logfile
          spawn socat STDIO,raw,echo=0 UNIX-CONNECT:$socket

          if {$mode eq "install143"} {
              wait_for_login "VyOS 1.4.3 live ISO"
              verify_version {1\.4\.3} "VyOS 1.4.3 live ISO"
              install_143
              poweroff_vm
          } elseif {$mode eq "upgrade151"} {
              wait_for_login "installed VyOS 1.4.3"
              verify_version {1\.4\.3} "installed VyOS 1.4.3"
              native_add_151
              poweroff_vm
          } elseif {$mode eq "verify151"} {
              wait_for_login "final VyOS boot"
              verify_version {1\.5\.1} "final VyOS boot"
              send -- "show system image\r"
              expect {
                  -re {1\.5\.1} {}
                  timeout { fail "final show system image lacks 1.5.1" }
                  eof { fail "serial closed during final image check" }
              }
              expect -re {vyos@[^\\r\\n]*[$#] ?$}
              puts "\nPASS: real VyOS 1.4.3 -> 1.5.1 native upgrade booted successfully"
              poweroff_vm
          } else {
              fail "unknown mode: $mode"
          }
          EXPECT
          chmod +x state/vyos-e2e.exp

      - name: Boot live VyOS 1.4.3 and install
        shell: bash
        run: |
          set -euxo pipefail
          ./state/start-qemu.sh live
          ./state/vyos-e2e.exp \
            install143 state/serial.sock logs/install-143.log

      - name: Stop first VM if necessary
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f state/qemu.pid ]]; then
            PID="$(cat state/qemu.pid)"
            for _ in $(seq 1 30); do
              kill -0 "${PID}" 2>/dev/null || break
              sleep 2
            done
            kill "${PID}" 2>/dev/null || true
            sleep 2
            kill -9 "${PID}" 2>/dev/null || true
          fi
          rm -f state/serial.sock state/monitor.sock state/qemu.pid

      - name: Start host HTTP server for VyOS 1.5.1 ISO
        shell: bash
        run: |
          set -euxo pipefail
          (
            cd images
            exec python3 -m http.server "${HTTP_PORT}" --bind 0.0.0.0
          ) > logs/http-server.log 2>&1 &
          echo $! > state/http.pid

          for _ in $(seq 1 20); do
            if curl --fail --silent --head \
              "http://127.0.0.1:${HTTP_PORT}/${VYOS_151_ISO}" >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat logs/http-server.log
          exit 1

      - name: Boot installed VyOS 1.4.3 and native-add 1.5.1
        shell: bash
        run: |
          set -euxo pipefail
          ./state/start-qemu.sh disk
          ./state/vyos-e2e.exp \
            upgrade151 state/serial.sock logs/upgrade-151.log

      - name: Stop upgrade VM if necessary
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -f state/qemu.pid ]]; then
            PID="$(cat state/qemu.pid)"
            for _ in $(seq 1 30); do
              kill -0 "${PID}" 2>/dev/null || break
              sleep 2
            done
            kill "${PID}" 2>/dev/null || true
            sleep 2
            kill -9 "${PID}" 2>/dev/null || true
          fi
          rm -f state/serial.sock state/monitor.sock state/qemu.pid

      - name: Boot upgraded system and verify VyOS 1.5.1
        shell: bash
        run: |
          set -euxo pipefail
          ./state/start-qemu.sh disk
          ./state/vyos-e2e.exp \
            verify151 state/serial.sock logs/final-151.log

      - name: Print diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "================ install-143.log ================"
          tail -n 500 logs/install-143.log 2>/dev/null || true
          echo "================ upgrade-151.log ================"
          tail -n 500 logs/upgrade-151.log 2>/dev/null || true
          echo "================ final-151.log =================="
          tail -n 500 logs/final-151.log 2>/dev/null || true
          echo "================ http-server.log ================"
          cat logs/http-server.log 2>/dev/null || true
          echo "================ qcow2 =========================="
          qemu-img info "${VM_DISK}" 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e

          if [[ -f state/qemu.pid ]]; then
            PID="$(cat state/qemu.pid)"
            kill "${PID}" 2>/dev/null || true
            sleep 2
            kill -9 "${PID}" 2>/dev/null || true
          fi

          if [[ -f state/http.pid ]]; then
            kill "$(cat state/http.pid)" 2>/dev/null || true
          fi

          rm -f state/serial.sock state/monitor.sock state/qemu.pid
