name: VyOS 1.4.3 to 1.5.1 E2E

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: vyos-test-images
  VYOS_143_ISO: vyos-1.4.3-generic-amd64.iso
  VYOS_151_ISO: vyos-1.5.1-generic-amd64.iso
  VM_DISK: vyos-e2e.qcow2
  VM_MEM: "4096"
  VM_CPUS: "2"
  HTTP_PORT: "8000"

jobs:
  e2e:
    name: Real VyOS 1.4.3 -> 1.5.1 native upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils expect curl socat file

      - name: Prepare workspace
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p images logs state
          qemu-img create -f qcow2 "${VM_DISK}" 8G

      - name: Download release ISOs
        shell: bash
        run: |
          set -euxo pipefail
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"

          curl --fail --location --retry 5 --retry-delay 3             -o "images/${VYOS_143_ISO}"             "${BASE}/${VYOS_143_ISO}"

          curl --fail --location --retry 5 --retry-delay 3             -o "images/${VYOS_151_ISO}"             "${BASE}/${VYOS_151_ISO}"

          test -s "images/${VYOS_143_ISO}"
          test -s "images/${VYOS_151_ISO}"
          file "images/${VYOS_143_ISO}" "images/${VYOS_151_ISO}"
          sha256sum "images/${VYOS_143_ISO}" "images/${VYOS_151_ISO}"

      - name: Boot VyOS 1.4.3 live ISO
        shell: bash
        run: |
          set -euxo pipefail
          rm -f state/serial.sock state/monitor.sock state/qemu.pid

          qemu-system-x86_64             -name vyos-e2e             -machine accel=kvm:tcg             -cpu max             -smp "${VM_CPUS}"             -m "${VM_MEM}"             -drive "file=${VM_DISK},if=virtio,format=qcow2"             -drive "file=images/${VYOS_143_ISO},media=cdrom,readonly=on"             -netdev user,id=net0             -device virtio-net-pci,netdev=net0             -display none             -chardev socket,id=serial0,path=state/serial.sock,server=on,wait=off             -serial chardev:serial0             -monitor unix:state/monitor.sock,server=on,wait=off             -pidfile state/qemu.pid             -daemonize             -boot d

          for i in $(seq 1 30); do
            test -S state/serial.sock && exit 0
            sleep 1
          done
          exit 1

      - name: Install VyOS 1.4.3
        shell: bash
        run: |
          set -euo pipefail

          cat > state/install.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 900
          log_user 1
          log_file -a logs/install-143.log
          spawn socat STDIO,raw,echo=0 UNIX-CONNECT:state/serial.sock

          proc die {msg} {
            puts stderr "ERROR: $msg"
            exit 1
          }

          proc login_vyos {} {
            set timeout 180
            send -- "\r"
            expect {
              -re {(?i)vyos login:\s*$} { send -- "vyos\r" }
              -re {vyos@vyos.*[$#]\s*$} { return }
              timeout { die "live login prompt not reached" }
              eof { die "serial console closed before live login" }
            }
            expect {
              -re {(?i)password:\s*$} { send -- "vyos\r" }
              -re {vyos@vyos.*[$#]\s*$} { return }
              timeout { die "live password prompt not reached" }
              eof { die "serial console closed at live password prompt" }
            }
            expect {
              -re {vyos@vyos.*[$#]\s*$} { return }
              -re {(?i)login incorrect} { die "VyOS rejected live vyos/vyos credentials" }
              -re {(?i)login timed out} { die "VyOS live login timed out after password submission" }
              timeout { die "live shell not reached after password" }
              eof { die "serial console closed before live shell" }
            }
          }

          login_vyos

          send -- "show version\r"
          expect {
            -re {1\.4\.3} {}
            timeout { die "live ISO is not VyOS 1.4.3" }
          }
          expect -re {vyos@vyos.*[$#] ?$}

          send -- "install image\r"

          set done 0
          for {set n 0} {$n < 100 && !$done} {incr n} {
            expect {
              -re {Would you like to continue\? \[y/N\]} {
                send -- "y\r"
              }
              -re {(?i)(select a drive|which drive|installation disk|install.*disk).*} {
                send -- "vda\r"
              }
              -re {(?i)(destroy all data|all data.*destroyed).*\[y/N\]} {
                send -- "y\r"
              }
              -re {(?i)(image name|name this image).*[:?] ?$} {
                send -- "\r"
              }
              -re {(?i)(root partition|partition size).*[:?] ?$} {
                send -- "\r"
              }
              -re {(?i)(keep.*config|copy.*config).*\[Y/n\]} {
                send -- "n\r"
              }
              -re {(?i)(keep.*config|copy.*config).*\[y/N\]} {
                send -- "n\r"
              }
              -re {(?i)(enter.*password|password for.*vyos).*: ?$} {
                send -- "vyos\r"
              }
              -re {(?i)(re-enter|repeat|confirm).*password.*: ?$} {
                send -- "vyos\r"
              }
              -re {(?i)(select.*bootloader|grub.*drive).*} {
                send -- "vda\r"
              }
              -re {(?i)(installation complete|installation completed|successfully installed)} {
                set done 1
              }
              -re {vyos@vyos.*[$#] ?$} {
                set done 1
              }
              timeout {
                die "timeout while installing VyOS 1.4.3"
              }
              eof {
                die "serial console closed during installation"
              }
            }
          }

          if {!$done} {
            die "installer did not complete"
          }

          send -- "sudo poweroff\r"
          expect {
            eof {}
            timeout {}
          }
          EXPECT

          chmod +x state/install.exp
          ./state/install.exp

      - name: Stop live VM if still running
        if: always()
        shell: bash
        run: |
          set +e
          if test -f state/qemu.pid; then
            PID="$(cat state/qemu.pid)"
            for i in $(seq 1 60); do
              kill -0 "${PID}" 2>/dev/null || exit 0
              sleep 2
            done
            kill "${PID}" 2>/dev/null || true
            sleep 2
            kill -9 "${PID}" 2>/dev/null || true
          fi

      - name: Boot installed VyOS 1.4.3
        shell: bash
        run: |
          set -euxo pipefail
          rm -f state/serial.sock state/monitor.sock state/qemu.pid

          qemu-system-x86_64             -name vyos-e2e             -machine accel=kvm:tcg             -cpu max             -smp "${VM_CPUS}"             -m "${VM_MEM}"             -drive "file=${VM_DISK},if=virtio,format=qcow2"             -netdev user,id=net0             -device virtio-net-pci,netdev=net0             -display none             -chardev socket,id=serial0,path=state/serial.sock,server=on,wait=off             -serial chardev:serial0             -monitor unix:state/monitor.sock,server=on,wait=off             -pidfile state/qemu.pid             -daemonize             -boot c

          for i in $(seq 1 30); do
            test -S state/serial.sock && exit 0
            sleep 1
          done
          exit 1

      - name: Start local HTTP server
        shell: bash
        run: |
          set -euxo pipefail
          cd images
          nohup python3 -m http.server "${HTTP_PORT}" --bind 0.0.0.0             > ../logs/http-server.log 2>&1 &
          echo $! > ../state/http.pid
          sleep 2
          curl --fail --head             "http://127.0.0.1:${HTTP_PORT}/${VYOS_151_ISO}"

      - name: Verify 1.4.3 and add VyOS 1.5.1
        shell: bash
        run: |
          set -euo pipefail

          cat > state/upgrade.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 1200
          log_user 1
          log_file -a logs/upgrade-151.log
          spawn socat STDIO,raw,echo=0 UNIX-CONNECT:state/serial.sock

          proc die {msg} {
            puts stderr "ERROR: $msg"
            exit 1
          }

          proc login_vyos {} {
            set timeout 240
            send -- "\r"
            expect {
              -re {(?i)vyos login:\s*$} { send -- "vyos\r" }
              -re {vyos@.*[$#]\s*$} { return }
              timeout { die "installed 1.4.3 login prompt not reached" }
              eof { die "serial console closed before installed 1.4.3 login" }
            }
            expect {
              -re {(?i)password:\s*$} { send -- "vyos\r" }
              -re {vyos@.*[$#]\s*$} { return }
              timeout { die "installed 1.4.3 password prompt not reached" }
              eof { die "serial console closed at installed 1.4.3 password prompt" }
            }
            expect {
              -re {vyos@.*[$#]\s*$} { return }
              -re {(?i)login incorrect} { die "VyOS rejected installed 1.4.3 credentials" }
              -re {(?i)login timed out} { die "installed 1.4.3 login timed out after password submission" }
              timeout { die "installed 1.4.3 shell not reached after password" }
              eof { die "serial console closed before installed 1.4.3 shell" }
            }
          }

          login_vyos

          send -- "show version\r"
          expect {
            -re {1\.4\.3} {}
            timeout { die "disk did not boot VyOS 1.4.3" }
          }
          expect -re {vyos@.*[$#] ?$}

          # QEMU user networking exposes the host as 10.0.2.2.
          send -- "add system image http://10.0.2.2:8000/vyos-1.5.1-generic-amd64.iso\r"

          set done 0
          for {set n 0} {$n < 100 && !$done} {incr n} {
            expect {
              -re {(?i)(continue|proceed).*\[y/N\]} {
                send -- "y\r"
              }
              -re {(?i)(image name|name this image).*[:?] ?$} {
                send -- "\r"
              }
              -re {(?i)(successfully added|installation complete|image.*installed|image.*added)} {
                set done 1
              }
              -re {vyos@.*[$#] ?$} {
                set done 1
              }
              -re {(?i)(compatibility check failed|incompatible image|downgrading image-tools|error:|failed)} {
                die "native add system image reported failure"
              }
              timeout {
                die "timeout while adding VyOS 1.5.1"
              }
              eof {
                die "serial console closed while adding VyOS 1.5.1"
              }
            }
          }

          if {!$done} {
            die "add system image did not complete"
          }

          send -- "show system image\r"
          expect {
            -re {1\.5\.1} {}
            timeout { die "VyOS 1.5.1 is not present in system image list" }
          }
          expect -re {vyos@.*[$#] ?$}

          send -- "reboot now\r"
          expect {
            -re {(?i)Are you sure.*\[y/N\]} { send -- "y\r" }
            eof {}
            timeout {}
          }
          EXPECT

          chmod +x state/upgrade.exp
          ./state/upgrade.exp

      - name: Wait for reboot
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          test -f state/qemu.pid
          kill -0 "$(cat state/qemu.pid)"

      - name: Verify running VyOS 1.5.1
        shell: bash
        run: |
          set -euo pipefail

          cat > state/verify-151.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout 420
          log_user 1
          log_file -a logs/verify-151.log
          spawn socat STDIO,raw,echo=0 UNIX-CONNECT:state/serial.sock

          proc die {msg} {
            puts stderr "ERROR: $msg"
            exit 1
          }

          proc login_vyos {} {
            set timeout 420
            send -- "\r"
            expect {
              -re {(?i)vyos login:\s*$} { send -- "vyos\r" }
              -re {vyos@.*[$#]\s*$} { return }
              timeout { die "VyOS 1.5.1 login prompt not reached after reboot" }
              eof { die "serial console closed before VyOS 1.5.1 login" }
            }
            expect {
              -re {(?i)password:\s*$} { send -- "vyos\r" }
              -re {vyos@.*[$#]\s*$} { return }
              timeout { die "VyOS 1.5.1 password prompt not reached" }
              eof { die "serial console closed at VyOS 1.5.1 password prompt" }
            }
            expect {
              -re {vyos@.*[$#]\s*$} { return }
              -re {(?i)login incorrect} { die "VyOS rejected 1.5.1 vyos/vyos credentials" }
              -re {(?i)login timed out} { die "VyOS 1.5.1 login timed out after password submission" }
              timeout { die "VyOS 1.5.1 shell not reached after password" }
              eof { die "serial console closed before VyOS 1.5.1 shell" }
            }
          }

          login_vyos

          send -- "show version\r"
          expect {
            -re {1\.5\.1} {}
            timeout { die "system did not boot VyOS 1.5.1" }
          }

          puts "PASS: real native VyOS 1.4.3 -> 1.5.1 upgrade succeeded"
          exit 0
          EXPECT

          chmod +x state/verify-151.exp
          ./state/verify-151.exp

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          set +e
          echo "===== install-143.log ====="
          cat logs/install-143.log 2>/dev/null || true
          echo "===== upgrade-151.log ====="
          cat logs/upgrade-151.log 2>/dev/null || true
          echo "===== verify-151.log ====="
          cat logs/verify-151.log 2>/dev/null || true
          echo "===== http-server.log ====="
          cat logs/http-server.log 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          if test -f state/http.pid; then
            kill "$(cat state/http.pid)" 2>/dev/null || true
          fi
          if test -f state/qemu.pid; then
            kill "$(cat state/qemu.pid)" 2>/dev/null || true
            sleep 2
            kill -9 "$(cat state/qemu.pid)" 2>/dev/null || true
          fi

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyos-143-to-151-e2e-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 7
