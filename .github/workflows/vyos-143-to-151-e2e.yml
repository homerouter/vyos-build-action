name: VyOS 1.4.3 to 1.5.1 E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: VyOS 1.4.3 -> 1.5.1 real VM E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      RELEASE_TAG: vyos-test-images
      ISO_143: vyos-1.4.3-generic-amd64.iso
      ISO_151: vyos-1.5.1-generic-amd64.iso
      DISK: vyos-e2e.qcow2
      SERIAL: serial.log
      MONITOR: monitor.sock
      QEMU_PID: qemu.pid

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            socat \
            expect \
            curl \
            jq \
            file

      - name: Download test ISOs from GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}"
          curl -fL --retry 5 --retry-delay 2 -o "$ISO_143" "$base/$ISO_143"
          curl -fL --retry 5 --retry-delay 2 -o "$ISO_151" "$base/$ISO_151"
          ls -lh "$ISO_143" "$ISO_151"
          file "$ISO_143" "$ISO_151"
          sha256sum "$ISO_143" "$ISO_151" | tee iso-sha256.txt

      - name: Create VM disk
        shell: bash
        run: |
          set -euxo pipefail
          qemu-img create -f qcow2 "$DISK" 8G
          qemu-img info "$DISK"

      - name: Create QEMU helper
        shell: bash
        run: |
          cat > qemu-helper.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          start_qemu() {
            local cdrom="${1:-}"
            local boot="${2:-c}"
            rm -f "$MONITOR" "$QEMU_PID"
            touch "$SERIAL"

            args=(
              -machine accel=kvm:tcg
              -cpu max
              -m 2048
              -smp 2
              -drive "file=$DISK,if=virtio,format=qcow2"
              -boot "$boot"
              -display none
              -serial "file:$SERIAL"
              -monitor "unix:$MONITOR,server,nowait"
              -no-reboot
            )
            if [[ -n "$cdrom" ]]; then
              args+=( -cdrom "$cdrom" )
            fi
            qemu-system-x86_64 "${args[@]}" &
            echo $! > "$QEMU_PID"
          }

          stop_qemu() {
            if [[ -S "$MONITOR" ]]; then
              printf 'quit\n' | socat - UNIX-CONNECT:"$MONITOR" || true
            fi
            if [[ -f "$QEMU_PID" ]]; then
              pid="$(cat "$QEMU_PID")"
              for _ in $(seq 1 20); do
                kill -0 "$pid" 2>/dev/null || return 0
                sleep 1
              done
              kill "$pid" 2>/dev/null || true
            fi
          }

          sendkey() {
            printf 'sendkey %s\n' "$1" | socat - UNIX-CONNECT:"$MONITOR"
          }

          case "${1:-}" in
            start) start_qemu "${2:-}" "${3:-c}" ;;
            stop) stop_qemu ;;
            sendkey) sendkey "$2" ;;
            *) echo "usage: $0 {start [iso] [boot]|stop|sendkey KEY}" >&2; exit 2 ;;
          esac
          SH
          chmod +x qemu-helper.sh

      - name: Boot VyOS 1.4.3 live ISO and force serial console
        shell: bash
        run: |
          set -euxo pipefail
          : > "$SERIAL"
          ./qemu-helper.sh start "$ISO_143" d

          # Give firmware/GRUB time to appear. The key sequence deliberately
          # attempts to edit the default GRUB entry and append serial consoles.
          sleep 8
          ./qemu-helper.sh sendkey esc || true
          sleep 2
          ./qemu-helper.sh sendkey e || true
          sleep 2

          # In many VyOS live images the default entry already contains a
          # console parameter. Boot it first; the ISO itself normally exposes
          # ttyS0. The serial log below is authoritative for diagnostics.
          ./qemu-helper.sh sendkey ctrl-x || true

          timeout 180 bash -c '
            until grep -Eq "VyOS login:|vyos login:" "$SERIAL"; do
              if [[ -f "$QEMU_PID" ]] && ! kill -0 "$(cat "$QEMU_PID")" 2>/dev/null; then
                echo "QEMU exited before login prompt" >&2
                exit 1
              fi
              sleep 2
            done
          ' || {
            echo "ERROR: VyOS 1.4.3 live ISO: VyOS login prompt not reached"
            echo "===== last 300 serial lines ====="
            tail -300 "$SERIAL" || true
            exit 1
          }

          tail -120 "$SERIAL"

      - name: Install VyOS 1.4.3 to virtual disk
        shell: bash
        run: |
          set -euxo pipefail
          cat > install143.exp <<'EXP'
          set timeout 300
          log_user 1
          spawn socat - UNIX-CONNECT:$env(MONITOR)
          # QEMU monitor cannot provide the guest serial stream when -serial is
          # a file, so drive the keyboard through monitor sendkey commands.
          expect "(qemu)"
          send "sendkey v\r"
          EXP

          # Use monitor key injection while observing serial.log. Login.
          key() { ./qemu-helper.sh sendkey "$1"; sleep 0.15; }
          type_text() {
            local s="$1" c
            for ((i=0; i<${#s}; i++)); do
              c="${s:i:1}"
              case "$c" in
                [a-z0-9]) key "$c" ;;
                ' ') key spc ;;
                '-') key minus ;;
                '/') key slash ;;
                '.') key dot ;;
                '_') key shift-minus ;;
                *) echo "unsupported key: $c" >&2; return 1 ;;
              esac
            done
          }

          type_text vyos; key ret
          sleep 2
          type_text vyos; key ret

          timeout 60 bash -c 'until grep -Eq "vyos@vyos:.*[$#]" "$SERIAL"; do sleep 1; done' || {
            echo "ERROR: live login failed"
            tail -200 "$SERIAL"
            exit 1
          }

          # Native installer. Answer its prompts according to what appears on
          # the serial console rather than assuming fixed timing.
          type_text 'install image'; key ret
          sleep 3

          answer_when() {
            local regex="$1" answer="$2" limit="${3:-60}"
            local before
            before=$(wc -c < "$SERIAL")
            timeout "$limit" bash -c "until tail -c +$((before+1)) '$SERIAL' | grep -Eq '$regex'; do sleep 1; done" || return 1
            type_text "$answer"; key ret
          }

          answer_when 'Would you like to continue.*\[y/N\]' y 90

          # Remaining installer prompts vary slightly between 1.4 builds.
          # Defaults are accepted for disk, partition size, image name and
          # config migration. Password prompts are explicitly answered.
          for _ in $(seq 1 12); do
            sleep 2
            chunk="$(tail -80 "$SERIAL")"
            if echo "$chunk" | grep -Eq 'Enter password|password for user|Password:'; then
              type_text vyos; key ret
              sleep 1
              type_text vyos; key ret
            elif echo "$chunk" | grep -Eq 'Would you like to continue.*\[y/N\]'; then
              type_text y; key ret
            elif echo "$chunk" | grep -Eq 'Which one should be used|Select disk|partition|image name|config|configuration|default:'; then
              key ret
            fi
            if echo "$chunk" | grep -Eq 'Installation completed|installed successfully|Done'; then
              break
            fi
          done

          timeout 180 bash -c 'until grep -Eq "Installation completed|installed successfully|Done" "$SERIAL"; do sleep 2; done' || {
            echo "ERROR: timeout while installing VyOS 1.4.3"
            tail -300 "$SERIAL"
            exit 1
          }

          tail -200 "$SERIAL"

      - name: Stop live VM
        if: always()
        shell: bash
        run: |
          ./qemu-helper.sh stop || true

      - name: Boot installed VyOS 1.4.3
        shell: bash
        run: |
          set -euxo pipefail
          : > "$SERIAL"
          ./qemu-helper.sh start "" c

          timeout 180 bash -c 'until grep -Eq "VyOS login:|vyos login:" "$SERIAL"; do sleep 2; done' || {
            echo "ERROR: installed VyOS 1.4.3 login prompt not reached"
            tail -300 "$SERIAL"
            exit 1
          }
          tail -150 "$SERIAL"

      - name: Report disk after 1.4.3 installation
        shell: bash
        run: |
          set -euxo pipefail
          qemu-img info "$DISK"
          ls -lh "$DISK"

      - name: E2E status
        shell: bash
        run: |
          echo "VyOS 1.4.3 live boot and disk installation completed."
          echo "The VM also reached the installed-system login prompt."
          echo "Next gate: attach/copy the 1.5.1 ISO into the installed VM and execute the native add-system-image path."

      - name: Final VM cleanup
        if: always()
        shell: bash
        run: |
          ./qemu-helper.sh stop || true
          sudo umount -R /mnt/vyos-e2e 2>/dev/null || true

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vyos-143-to-151-e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          path: |
            serial.log
            iso-sha256.txt
            qemu-helper.sh
            install143.exp
