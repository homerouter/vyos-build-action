name: Check VyOS 1.5.1 via VyOS 1.4.3 Native Code

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  VYOS_143_URL: https://cdn.as212934.net/routers/VyOS/vyos-1.4.3-generic-amd64.iso
  VYOS_151_URL: https://cdn.as212934.net/routers/VyOS/vyos-1.5.1-generic-amd64.iso

  VYOS_143_ISO: vyos-1.4.3-generic-amd64.iso
  VYOS_151_ISO: vyos-1.5.1-generic-amd64.iso

jobs:
  vyos-native-check:
    name: VyOS 1.4.3 -> 1.5.1 native compatibility check
    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:
      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # Host tools
      # ============================================================

      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            squashfs-tools \
            xorriso \
            file \
            rsync

      # ============================================================
      # Download both VyOS images
      # ============================================================

      - name: Download VyOS images
        shell: bash
        run: |
          set -euxo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "${VYOS_143_ISO}" \
            "${VYOS_143_URL}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "${VYOS_151_ISO}" \
            "${VYOS_151_URL}"

          echo
          echo "======================================================"
          echo " Downloaded images"
          echo "======================================================"

          ls -lh \
            "${VYOS_143_ISO}" \
            "${VYOS_151_ISO}"

          echo
          echo "======================================================"
          echo " File types"
          echo "======================================================"

          file "${VYOS_143_ISO}"
          file "${VYOS_151_ISO}"

          echo
          echo "======================================================"
          echo " SHA256"
          echo "======================================================"

          sha256sum \
            "${VYOS_143_ISO}" \
            "${VYOS_151_ISO}"

      # ============================================================
      # Basic ISO9660 validation
      # ============================================================

      - name: Validate ISO9660 images
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================================"
          echo " VyOS 1.4.3 ISO"
          echo "======================================================"

          xorriso \
            -indev "${VYOS_143_ISO}" \
            -pvd_info

          echo
          echo "======================================================"
          echo " VyOS 1.5.1 ISO"
          echo "======================================================"

          xorriso \
            -indev "${VYOS_151_ISO}" \
            -pvd_info

      # ============================================================
      # Extract 1.4.3 ISO
      # ============================================================

      - name: Extract VyOS 1.4.3 ISO
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            vyos143-iso \
            target-root

          xorriso \
            -osirrox on \
            -indev "${VYOS_143_ISO}" \
            -extract / vyos143-iso

          echo
          echo "======================================================"
          echo " VyOS 1.4.3 required files"
          echo "======================================================"

          test -s vyos143-iso/live/filesystem.squashfs
          test -s vyos143-iso/live/vmlinuz
          test -s vyos143-iso/live/initrd.img
          test -s vyos143-iso/version.json

          ls -lh \
            vyos143-iso/live/filesystem.squashfs \
            vyos143-iso/live/vmlinuz \
            vyos143-iso/live/initrd.img \
            vyos143-iso/version.json

          echo
          echo "==== VyOS 1.4.3 version.json ===="
          cat vyos143-iso/version.json

      # ============================================================
      # Extract 1.4.3 root filesystem
      # ============================================================

      - name: Extract VyOS 1.4.3 root filesystem
        shell: bash
        run: |
          set -euxo pipefail

          sudo unsquashfs \
            -d target-root \
            vyos143-iso/live/filesystem.squashfs

          echo
          echo "======================================================"
          echo " VyOS 1.4.3 root filesystem"
          echo "======================================================"

          sudo du -sh target-root

          test -x target-root/bin/bash
          test -x target-root/usr/bin/python3

          test -f \
            target-root/usr/libexec/vyos/op_mode/image_installer.py

          test -f \
            target-root/usr/lib/python3/dist-packages/vyos/system/image.py

          test -f \
            target-root/usr/lib/python3/dist-packages/vyos/system/compat.py

      # ============================================================
      # Verify exact 1.4.3 add system image implementation
      # ============================================================

      - name: Verify VyOS 1.4.3 native image installer
        shell: bash
        run: |
          set -euxo pipefail

          NODE_DEF="target-root/opt/vyatta/share/vyatta-op/templates/add/system/image/node.tag/node.def"
          INSTALLER="target-root/usr/libexec/vyos/op_mode/image_installer.py"
          IMAGE_LIB="target-root/usr/lib/python3/dist-packages/vyos/system/image.py"
          COMPAT_LIB="target-root/usr/lib/python3/dist-packages/vyos/system/compat.py"

          test -f "${NODE_DEF}"
          test -f "${INSTALLER}"
          test -f "${IMAGE_LIB}"
          test -f "${COMPAT_LIB}"

          echo "======================================================"
          echo " VyOS 1.4.3 add system image CLI definition"
          echo "======================================================"

          cat "${NODE_DEF}"

          echo
          echo "======================================================"
          echo " Expected native entry point"
          echo "======================================================"

          grep -F \
            'image_installer.py --action add' \
            "${NODE_DEF}"

          echo
          echo "PASS: native add-system-image implementation found"

      # ============================================================
      # Show only useful parts of the native implementation
      #
      # Do NOT recursively grep all Python packages. That produced
      # enormous output from vyos_1x_cache.py in the previous run.
      # ============================================================

      - name: Inspect VyOS 1.4.3 native image API
        shell: bash
        run: |
          set -euxo pipefail

          IMAGE_LIB="target-root/usr/lib/python3/dist-packages/vyos/system/image.py"
          COMPAT_LIB="target-root/usr/lib/python3/dist-packages/vyos/system/compat.py"
          INSTALLER="target-root/usr/libexec/vyos/op_mode/image_installer.py"

          echo "======================================================"
          echo " image.py"
          echo "======================================================"

          sudo sed -n '1,240p' "${IMAGE_LIB}"

          echo
          echo "======================================================"
          echo " compat.py"
          echo "======================================================"

          sudo sed -n '1,330p' "${COMPAT_LIB}"

          echo
          echo "======================================================"
          echo " image_installer.py relevant references"
          echo "======================================================"

          sudo grep -nE \
            'get_image|version|compat|squashfs|image-path|image_path|mount|action.*add' \
            "${INSTALLER}" \
            | head -300 \
            || true

      # ============================================================
      # Extract 1.5.1 ISO
      # ============================================================

      - name: Extract VyOS 1.5.1 ISO
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p vyos151-iso

          xorriso \
            -osirrox on \
            -indev "${VYOS_151_ISO}" \
            -extract / vyos151-iso

          echo
          echo "======================================================"
          echo " VyOS 1.5.1 required files"
          echo "======================================================"

          test -s vyos151-iso/live/filesystem.squashfs
          test -s vyos151-iso/live/vmlinuz
          test -s vyos151-iso/live/initrd.img
          test -s vyos151-iso/version.json
          test -s vyos151-iso/sha256sum.txt

          ls -lh \
            vyos151-iso/live/filesystem.squashfs \
            vyos151-iso/live/vmlinuz \
            vyos151-iso/live/initrd.img \
            vyos151-iso/version.json \
            vyos151-iso/sha256sum.txt

          echo
          echo "======================================================"
          echo " VyOS 1.5.1 version.json"
          echo "======================================================"

          cat vyos151-iso/version.json

          echo
          echo "======================================================"
          echo " VyOS 1.5.1 SquashFS metadata"
          echo "======================================================"

          unsquashfs \
            -s \
            vyos151-iso/live/filesystem.squashfs

      # ============================================================
      # Verify internal checksum manifest
      # ============================================================

      - name: Validate VyOS 1.5.1 internal checksums
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================================"
          echo " VyOS 1.5.1 internal SHA256 manifest"
          echo "======================================================"

          cd vyos151-iso

          test -s sha256sum.txt

          sha256sum -c sha256sum.txt

          echo
          echo "PASS: VyOS 1.5.1 internal SHA256 manifest"

      # ============================================================
      # Mount 1.5.1 rootfs INSIDE the future chroot namespace.
      #
      # target-root/mnt/vyos151 on the host becomes
      # /mnt/vyos151 inside the 1.4.3 chroot.
      # ============================================================

      - name: Mount VyOS 1.5.1 root filesystem
        shell: bash
        run: |
          set -euxo pipefail

          sudo mkdir -p target-root/mnt/vyos151

          sudo mount \
            -t squashfs \
            -o loop,ro \
            vyos151-iso/live/filesystem.squashfs \
            target-root/mnt/vyos151

          echo "======================================================"
          echo " Mounted VyOS 1.5.1 root filesystem"
          echo "======================================================"

          mount | grep 'target-root/mnt/vyos151'

          test -d target-root/mnt/vyos151/usr
          test -d target-root/mnt/vyos151/opt

          echo
          echo "Root filesystem size:"
          sudo du -sh target-root/mnt/vyos151

      # ============================================================
      # Prepare minimal 1.4.3 chroot
      # ============================================================

      - name: Prepare VyOS 1.4.3 chroot
        shell: bash
        run: |
          set -euxo pipefail

          sudo mount --bind /dev target-root/dev
          sudo mount --bind /dev/pts target-root/dev/pts

          sudo mount \
            -t proc \
            proc \
            target-root/proc

          sudo mount \
            -t sysfs \
            sys \
            target-root/sys

          sudo mkdir -p target-root/run

          sudo mount \
            -t tmpfs \
            tmpfs \
            target-root/run

          echo "======================================================"
          echo " VyOS 1.4.3 chroot environment"
          echo "======================================================"

          sudo chroot target-root /bin/bash -c '
            set -e

            echo "Python:"
            /usr/bin/python3 --version

            echo
            echo "Kernel view:"
            uname -a

            echo
            echo "Target image mount:"
            mount | grep /mnt/vyos151 || true

            echo
            echo "Target root:"
            ls -ld /mnt/vyos151
          '

      # ============================================================
      # Native 1.4.3 parser -> 1.5.1
      #
      # This is the important test:
      # Python and vyos.system.image both come from VyOS 1.4.3.
      # The inspected root filesystem comes from VyOS 1.5.1.
      # ============================================================

      - name: Test VyOS 1.4.3 native parser against VyOS 1.5.1
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================================"
          echo " VyOS 1.4.3 native image API -> VyOS 1.5.1"
          echo "======================================================"

          sudo chroot target-root \
            /usr/bin/python3 \
            - <<'PY'
          import sys
          import traceback

          from vyos.system import image

          target = "/mnt/vyos151"

          print("Source runtime : VyOS 1.4.3")
          print("Target rootfs  :", target)
          print()

          print("Available VyOS image API:")
          for name in sorted(dir(image)):
              lower = name.lower()
              if (
                  "image" in lower
                  or "version" in lower
                  or "compat" in lower
              ):
                  print("  ", name)

          print()
          print("------------------------------------------------------")
          print("get_image_tools_version()")
          print("------------------------------------------------------")

          try:
              tools_version = image.get_image_tools_version(target)
          except Exception:
              print("FAIL: VyOS 1.4.3 could not parse image-tools metadata")
              traceback.print_exc()
              sys.exit(1)

          print("image-tools version:", tools_version)

          if tools_version is None:
              print("FAIL: image-tools version returned None")
              sys.exit(1)

          print()
          print("PASS: VyOS 1.4.3 successfully parsed")
          print("      VyOS 1.5.1 image-tools metadata.")
          PY

      # ============================================================
      # Test other 1.4.3 image API functions when available.
      #
      # The exact API differs between VyOS releases, therefore
      # inspect and invoke only known callable functions.
      # ============================================================

      - name: Probe VyOS 1.4.3 image version API
        shell: bash
        run: |
          set -euxo pipefail

          sudo chroot target-root \
            /usr/bin/python3 \
            - <<'PY'
          import inspect
          import traceback

          from vyos.system import image

          target = "/mnt/vyos151"

          candidates = [
              "get_image_version",
              "get_image_versions",
              "get_versions",
              "get_image_info",
          ]

          print("======================================================")
          print(" Additional VyOS 1.4.3 image API probe")
          print("======================================================")
          print()

          found = False

          for name in candidates:
              fn = getattr(image, name, None)

              if not callable(fn):
                  continue

              found = True

              print(f"Function: {name}")

              try:
                  sig = inspect.signature(fn)
                  print("Signature:", sig)
              except Exception:
                  sig = None
                  print("Signature: unavailable")

              # Only automatically invoke functions that take one
              # required positional argument. This avoids guessing
              # APIs with destructive or unrelated semantics.
              if sig is not None:
                  required = [
                      p for p in sig.parameters.values()
                      if p.default is inspect.Parameter.empty
                      and p.kind in (
                          inspect.Parameter.POSITIONAL_ONLY,
                          inspect.Parameter.POSITIONAL_OR_KEYWORD,
                      )
                  ]

                  if len(required) == 1:
                      try:
                          result = fn(target)
                          print("Result:", result)
                      except Exception as exc:
                          print(
                              "Invocation failed:",
                              type(exc).__name__,
                              str(exc),
                          )

              print()

          if not found:
              print(
                  "No additional known single-rootfs image API "
                  "was found; get_image_tools_version() remains "
                  "the authoritative parser test in this workflow."
              )
          PY

      # ============================================================
      # Show installer CLI without running --action add.
      #
      # IMPORTANT:
      # We deliberately do NOT perform installation here.
      # ============================================================

      - name: Verify native image installer CLI
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================================"
          echo " VyOS 1.4.3 image_installer.py --help"
          echo "======================================================"

          set +e

          sudo chroot target-root \
            /usr/libexec/vyos/op_mode/image_installer.py \
            --help

          RC=$?

          set -e

          echo
          echo "image_installer.py --help exit code: ${RC}"

          echo
          echo "NOTE:"
          echo "The workflow intentionally does NOT execute:"
          echo
          echo "  image_installer.py --action add --image-path ..."
          echo
          echo "because that is the real installation path and this"
          echo "chroot does not represent a complete installed VyOS"
          echo "boot/storage/GRUB environment."

      # ============================================================
      # Final result
      # ============================================================

      - name: Compatibility result
        shell: bash
        run: |
          set -euo pipefail

         