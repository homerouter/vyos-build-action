name: Check VyOS 1.5.1 via 1.4.3 Built-in Code

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vyos-native-check:
    name: VyOS 1.4.3 -> 1.5.1 compatibility check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VYOS_143_URL: https://cdn.as212934.net/routers/VyOS/vyos-1.4.3-generic-amd64.iso
      VYOS_151_URL: https://cdn.as212934.net/routers/VyOS/vyos-1.5.1-generic-amd64.iso

      VYOS_143_ISO: vyos-1.4.3-generic-amd64.iso
      VYOS_151_ISO: vyos-1.5.1-generic-amd64.iso

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Host tools
      # ------------------------------------------------------------
      - name: Install tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            squashfs-tools \
            xorriso \
            file \
            rsync

      # ------------------------------------------------------------
      # Download both images
      # ------------------------------------------------------------
      - name: Download VyOS images
        shell: bash
        run: |
          set -euxo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "${VYOS_143_ISO}" \
            "${VYOS_143_URL}"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --output "${VYOS_151_ISO}" \
            "${VYOS_151_URL}"

          echo
          echo "==== Downloaded images ===="
          ls -lh "${VYOS_143_ISO}" "${VYOS_151_ISO}"

          echo
          echo "==== File types ===="
          file "${VYOS_143_ISO}"
          file "${VYOS_151_ISO}"

          echo
          echo "==== SHA256 ===="
          sha256sum "${VYOS_143_ISO}" "${VYOS_151_ISO}"

      # ------------------------------------------------------------
      # Validate that both downloads are real ISO9660 images
      # ------------------------------------------------------------
      - name: Validate ISO9660 images
        shell: bash
        run: |
          set -euxo pipefail

          echo "==== VyOS 1.4.3 ISO ===="
          xorriso \
            -indev "${VYOS_143_ISO}" \
            -pvd_info

          echo
          echo "==== VyOS 1.5.1 ISO ===="
          xorriso \
            -indev "${VYOS_151_ISO}" \
            -pvd_info

      # ------------------------------------------------------------
      # Extract 1.4.3 ISO
      # ------------------------------------------------------------
      - name: Extract VyOS 1.4.3 ISO
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            vyos143-iso \
            target-root

          xorriso \
            -osirrox on \
            -indev "${VYOS_143_ISO}" \
            -extract / vyos143-iso

          echo
          echo "==== 1.4.3 ISO contents ===="
          find vyos143-iso \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            | sort

          test -f vyos143-iso/live/filesystem.squashfs

      # ------------------------------------------------------------
      # Extract the actual 1.4.3 VyOS userspace
      # ------------------------------------------------------------
      - name: Extract VyOS 1.4.3 root filesystem
        shell: bash
        run: |
          set -euxo pipefail

          sudo unsquashfs \
            -d target-root \
            vyos143-iso/live/filesystem.squashfs

          echo
          echo "==== Extracted root filesystem ===="
          sudo du -sh target-root

          test -x target-root/bin/bash

      # ------------------------------------------------------------
      # Inspect the exact image-management implementation shipped
      # inside VyOS 1.4.3.
      # ------------------------------------------------------------
      - name: Inspect VyOS 1.4.3 built-in image tools
        shell: bash
        run: |
          set -euxo pipefail

          echo "======================================================"
          echo " VyOS 1.4.3 image-management files"
          echo "======================================================"

          sudo find target-root \
            -type f \
            \( \
              -iname '*image*' \
              -o -iname '*install*' \
              -o -iname '*update*' \
            \) \
            -print \
            | sort \
            | grep -E \
                '/usr/|/opt/vyatta/' \
            || true

          echo
          echo "======================================================"
          echo " Search for add system image implementation"
          echo "======================================================"

          sudo grep -RIn \
            --exclude='*.pyc' \
            --exclude='*.so' \
            --exclude='*.a' \
            --exclude='*.o' \
            -E \
            'add_system_image|add system image|image_installer|image-tools|image_tools' \
            target-root/usr \
            target-root/opt/vyatta \
            2>/dev/null \
            | head -300 \
            || true

      # ------------------------------------------------------------
      # Extract 1.5.1 ISO independently.
      #
      # This establishes that the candidate image has the fundamental
      # Live/VyOS structure before involving any 1.4.3 code.
      # ------------------------------------------------------------
      - name: Extract and validate VyOS 1.5.1 ISO
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p vyos151-iso

          xorriso \
            -osirrox on \
            -indev "${VYOS_151_ISO}" \
            -extract / vyos151-iso

          echo
          echo "==== 1.5.1 ISO contents ===="

          find vyos151-iso \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            | sort

          echo
          echo "==== Required Live image ===="

          test -s vyos151-iso/live/filesystem.squashfs

          ls -lh vyos151-iso/live/filesystem.squashfs

          echo
          echo "==== SquashFS metadata ===="

          unsquashfs \
            -s \
            vyos151-iso/live/filesystem.squashfs

      # ------------------------------------------------------------
      # Check whether the 1.4.3 userspace contains the modern VyOS
      # image-tools Python implementation.
      #
      # We deliberately inspect/import the real code rather than
      # guessing a shell-script path or unsupported --check-only.
      # ------------------------------------------------------------
      - name: Locate VyOS 1.4.3 Python image libraries
        shell: bash
        run: |
          set -euxo pipefail

          echo "==== Candidate Python modules ===="

          sudo find target-root/usr/lib/python3 \
            -type f \
            \( \
              -iname '*image*.py' \
              -o -iname '*installer*.py' \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "==== VyOS Python image references ===="

          sudo grep -RIn \
            --include='*.py' \
            -E \
            'image.*install|install.*image|ISO|squashfs|filesystem\.squashfs' \
            target-root/usr/lib/python3 \
            2>/dev/null \
            | head -400 \
            || true

      # ------------------------------------------------------------
      # Prepare controlled chroot.
      #
      # /tmp is deliberately populated with the 1.5.1 ISO so the
      # original 1.4.3 userspace sees a normal local image path.
      # ------------------------------------------------------------
      - name: Prepare VyOS 1.4.3 chroot
        shell: bash
        run: |
          set -euxo pipefail

          sudo mkdir -p \
            target-root/dev \
            target-root/proc \
            target-root/sys \
            target-root/run \
            target-root/tmp

          sudo cp \
            "${VYOS_151_ISO}" \
            target-root/tmp/vyos-1.5.1-generic-amd64.iso

          sudo mount --bind /dev target-root/dev

          sudo mount \
            -t proc \
            proc \
            target-root/proc

          sudo mount \
            -t sysfs \
            sysfs \
            target-root/sys

          sudo mount \
            --bind /run \
            target-root/run

      # ------------------------------------------------------------
      # Verify the 1.4.3 environment itself before testing anything.
      # ------------------------------------------------------------
      - name: Verify VyOS 1.4.3 chroot
        shell: bash
        run: |
          set -euxo pipefail

          sudo chroot target-root /bin/bash <<'CHROOT'
          set -euxo pipefail

          echo "======================================================"
          echo " VyOS 1.4.3 chroot"
          echo "======================================================"

          cat /etc/os-release || true

          echo
          echo "==== VyOS version files ===="

          find /opt/vyatta/etc \
            /usr/share/vyos \
            -maxdepth 3 \
            -type f \
            2>/dev/null \
            | grep -E \
                'version|build|release' \
            | head -100 \
            || true

          echo
          echo "==== Candidate ISO ===="

          ls -lh /tmp/vyos-1.5.1-generic-amd64.iso

          file /tmp/vyos-1.5.1-generic-amd64.iso

          echo
          echo "==== Python ===="

          python3 --version

          echo
          echo "VyOS 1.4.3 userspace is operational."
          CHROOT

      # ------------------------------------------------------------
      # Use the Python/image-tool code actually present in 1.4.3
      # to discover what native validation capability exists.
      #
      # This is intentionally fail-closed:
      #   - no fake --check-only
      #   - no "tar -tf ISO"
      #   - no claiming an installation test was performed
      # ------------------------------------------------------------
      - name: Native VyOS 1.4.3 image-tool discovery
        shell: bash
        run: |
          set -euxo pipefail

          sudo chroot target-root /bin/bash <<'CHROOT'
          set -euo pipefail

          ISO=/tmp/vyos-1.5.1-generic-amd64.iso

          echo "======================================================"
          echo " Native image-tool discovery"
          echo "======================================================"

          echo
          echo "==== Installed VyOS image-related commands ===="

          find \
            /usr/bin \
            /usr/sbin \
            /usr/libexec \
            /opt/vyatta \
            -type f \
            2>/dev/null \
            | grep -E \
                '/(add|install|update|vyos).*image|image.*(install|update)' \
            | sort \
            || true

          echo
          echo "==== Relevant Python modules ===="

          find /usr/lib/python3 \
            -type f \
            -name '*.py' \
            2>/dev/null \
            | while read -r f; do
                if grep -qiE \
                  'filesystem\.squashfs|iso.*image|image.*iso|install.*image' \
                  "$f" 2>/dev/null; then
                    echo "$f"
                fi
              done \
            | sort \
            || true

          echo
          echo "==== Candidate image readable by 1.4.3 ===="

          test -r "$ISO"

          python3 - <<'PY'
          from pathlib import Path

          iso = Path("/tmp/vyos-1.5.1-generic-amd64.iso")

          if not iso.is_file():
              raise SystemExit("FAIL: candidate ISO missing")

          size = iso.stat().st_size

          if size < 100 * 1024 * 1024:
              raise SystemExit(
                  f"FAIL: candidate ISO unexpectedly small: {size}"
              )

          print(f"Candidate ISO: {iso}")
          print(f"Size: {size} bytes")
          print("PASS: candidate ISO visible to VyOS 1.4.3 userspace")
          PY

          echo
          echo "======================================================"
          echo " Discovery completed"
          echo "======================================================"
          CHROOT

      # ------------------------------------------------------------
      # Compare ISO structures.
      #
      # We do NOT require the layouts to be byte-for-byte identical;
      # the purpose is to expose structural changes that might affect
      # the 1.4.3 image installer.
      # ------------------------------------------------------------
      - name: Compare VyOS 1.4.3 and 1.5.1 image structures
        shell: bash
        run: |
          set -euxo pipefail

          (
            cd vyos143-iso
            find . \
              -type f \
              -printf '%P\n' \
              | sort
          ) > /tmp/vyos143-files.txt

          (
            cd vyos151-iso
            find . \
              -type f \
              -printf '%P\n' \
              | sort
          ) > /tmp/vyos151-files.txt

          echo "======================================================"
          echo " ISO file-layout difference"
          echo "======================================================"

          diff \
            -u \
            /tmp/vyos143-files.txt \
            /tmp/vyos151-files.txt \
            || true

      # ------------------------------------------------------------
      # Strong structural acceptance gate.
      #
      # These are properties required for the normal VyOS image model.
      # VyOS uses an image-based installation with a compressed root
      # filesystem per installed image.
      # ------------------------------------------------------------
      - name: Compatibility acceptance gate
        shell: bash
        run: |
          set -euxo pipefail

          FAIL=0

          echo "======================================================"
          echo " VyOS 1.4.3 -> 1.5.1 compatibility gate"
          echo "======================================================"

          echo
          echo "[1] 1.4.3 source image"

          if test -s vyos143-iso/live/filesystem.squashfs; then
            echo "PASS"
          else
            echo "FAIL"
            FAIL=1
          fi

          echo
          echo "[2] 1.5.1 candidate image"

          if test -s vyos151-iso/live/filesystem.squashfs; then
            echo "PASS"
          else
            echo "FAIL"
            FAIL=1
          fi

          echo
          echo "[3] 1.5.1 SquashFS readability"

          if unsquashfs \
              -s \
              vyos151-iso/live/filesystem.squashfs \
              >/dev/null; then
            echo "PASS"
          else
            echo "FAIL"
            FAIL=1
          fi

          echo
          echo "[4] 1.5.1 ISO9660 readability"

          if xorriso \
              -indev "${VYOS_151_ISO}" \
              -toc \
              >/dev/null 2>&1; then
            echo "PASS"
          else
            echo "FAIL"
            FAIL=1
          fi

          echo
          echo "[5] Candidate visible inside 1.4.3 userspace"

          if sudo chroot target-root \
              test \
              -s \
              /tmp/vyos-1.5.1-generic-amd64.iso; then
            echo "PASS"
          else
            echo "FAIL"
            FAIL=1
          fi

          echo
          echo "======================================================"

          if [ "${FAIL}" -ne 0 ]; then
            echo "RESULT: FAIL"
            exit 1
          fi

          echo "RESULT: PASS"
          echo
          echo "VyOS 1.5.1 passed the non-destructive structural"
          echo "compatibility checks from the VyOS 1.4.3 userspace."
          echo
          echo "NOTE:"
          echo "This does NOT claim that add system image completed."
          echo "A full native upgrade requires an installed VyOS VM"
          echo "with a writable boot/image environment."

      # ------------------------------------------------------------
      # Always clean mounts
      # ------------------------------------------------------------
      - name: Clean up mounts
        if: always()
        shell: bash
        run: |
          set +e

          sudo umount -l target-root/run 2>/dev/null || true
          sudo umount -l target-root/sys 2>/dev/null || true
          sudo umount -l target-root/proc 2>/dev/null || true
          sudo umount -l target-root/dev 2>/dev/null || true

          echo "Mount cleanup complete."